<header class="admin-header">
  <div class="admin-header__brand">
    <span class="admin-header__seal">AIT</span>
    <span class="admin-header__mark">Student Portal</span>
  </div>

  <span class="admin-header__welcome">Welcome back</span>

  <div class="admin-header__user">
    <span class="admin-header__avatar">{{ initial }}</span>
    <span>{{ firstName }}</span>
    <i class="bi bi-box-arrow-right admin-header__logout" (click)="logout()" title="Log out"></i>
  </div>
</header>
