<div *ngIf="!firstTime" class="admin-eyebrow">
  <i class="bi bi-shield-lock"></i>
  <span>Password</span>
</div>

<div class="password-card" [class.password-card--standalone]="firstTime">
  <h2>Update Password</h2>

  <form (ngSubmit)="update()" #f="ngForm">
    <div class="ledger-field">
      <label>New Password</label>
      <div class="field-with-icon">
        <input
          [type]="showPassword ? 'text' : 'password'"
          required
          [(ngModel)]="newPassword"
          name="newPassword"
          placeholder="New Password" />
        <i class="bi" [ngClass]="showPassword ? 'bi-eye' : 'bi-eye-slash'" (click)="togglePassword()"></i>
      </div>
    </div>

    <div class="ledger-field">
      <label>Confirm Password</label>
      <div class="field-with-icon">
        <input
          [type]="showPassword ? 'text' : 'password'"
          required
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="Confirm Password" />
        <i class="bi" [ngClass]="showPassword ? 'bi-eye' : 'bi-eye-slash'" (click)="togglePassword()"></i>
      </div>
    </div>

    <div class="ledger-actions" style="justify-content: center;">
      <button type="submit" class="btn-ledger-primary" [disabled]="!f.form.valid || loading">Update</button>
      <button *ngIf="!firstTime" type="button" class="btn-ledger-secondary" routerLink="/faculty/profile">
        Cancel
      </button>
    </div>

    <div *ngIf="loading" class="ledger-status" style="justify-content: center;">
      <span class="dot"></span> Updating
    </div>
    <p *ngIf="error" class="ledger-error" style="text-align: center;">{{ error }}</p>
  </form>
</div>
