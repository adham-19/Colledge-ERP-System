<div class="admin-eyebrow">
  <i class="bi bi-plus-circle"></i>
  <span>Create Test</span>
</div>

<form class="ledger-panel ledger-form" (ngSubmit)="submit()" #f="ngForm">
  <div class="ledger-grid">
    <div>
      <div class="ledger-field">
        <label>Test Name</label>
        <input type="text" required placeholder="Test Name" [(ngModel)]="value.test" name="test" />
      </div>
      <div class="ledger-field">
        <label>Subject Code</label>
        <input type="text" required placeholder="Subject Code" [(ngModel)]="value.subjectCode" name="subjectCode" />
      </div>
      <div class="ledger-field">
        <label>Department</label>
        <input type="text" [value]="department" disabled />
      </div>
      <div class="ledger-field">
        <label>Year</label>
        <select required [(ngModel)]="value.year" name="year">
          <option value="">None</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </div>
    </div>

    <div>
      <div class="ledger-field">
        <label>Total Marks</label>
        <input type="number" required placeholder="Total Marks" [(ngModel)]="value.totalMarks" name="totalMarks" />
      </div>
      <div class="ledger-field">
        <label>Date</label>
        <input type="date" required [(ngModel)]="value.date" name="date" />
      </div>
      <div class="ledger-field">
        <label>Section</label>
        <select required [(ngModel)]="value.section" name="section">
          <option value="">None</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </div>
    </div>
  </div>

  <div class="ledger-actions">
    <button type="submit" class="btn-ledger-primary" [disabled]="!f.form.valid || loading">Submit</button>
    <button type="button" class="btn-ledger-secondary" (click)="clear()">Clear</button>
  </div>

  <div *ngIf="loading" class="ledger-status"><span class="dot"></span> Creating Test</div>
  <p *ngIf="error" class="ledger-error">{{ error }}</p>
</form>
