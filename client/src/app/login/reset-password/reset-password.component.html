<div class="card-scene grain-bg" [style.--role-color]="roleColor">
  <div class="admit-card">
    <div class="admit-card__stripe"></div>

    <div class="admit-card__header">
      <div>
        <span class="admit-card__eyebrow">
          ABC Institute &middot; Account Recovery
        </span>

        <div class="admit-card__role">Reset Password</div>
      </div>

      <div class="admit-card__seal">R</div>
    </div>

    <form
      (ngSubmit)="submit()"
      #resetPassword="ngForm"
      class="admit-card__body"
    >
      <!-- New Password -->
      <div class="field-group">
        <label class="field-label">New Password</label>
        <div class="field-with-icon">
          <input
            [type]="showNewPassword ? 'text' : 'password'"
            name="newPassword"
            required
            class="field-input"
            placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
            [(ngModel)]="newPassword"
          />
          <span class="eye-toggle" (click)="toggleNewPassword()">
            <i
              class="bi"
              [ngClass]="showNewPassword ? 'bi-eye' : 'bi-eye-slash'"
            ></i>
          </span>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="field-group">
        <label class="field-label">Confirm Password</label>
        <div class="field-with-icon">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            name="confirmPassword"
            required
            class="field-input"
            placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
            [(ngModel)]="confirmPassword"
          />
          <span class="eye-toggle" (click)="toggleConfirmPassword()">
            <i
              class="bi"
              [ngClass]="showConfirmPassword ? 'bi-eye' : 'bi-eye-slash'"
            ></i>
          </span>
        </div>
      </div>

      <!-- Submit -->
      <button
        type="submit"
        [disabled]="!resetPassword.form.valid || loading"
        class="admit-submit"
      >
        Reset Password
      </button>

      <!-- Optional status -->
      <div *ngIf="loading" class="admit-status">
        <span class="dot"></span>
        reseting password
      </div>
    </form>

    <div class="success-overlay" *ngIf="showSuccessPopup">
      <div class="success-popup" [class.error-popup]="popupIsError">
        <div class="success-icon">
          {{ popupIsError ? "!" : "✓" }}
        </div>

        <h2>
          {{
            popupIsError
              ? "Unable to Reset Password"
              : "Password Reset Successfully"
          }}
        </h2>

        <p>
          {{ popupMessage }}
        </p>

        <button
          type="button"
          class="popup-button"
          (click)="closeSuccessPopup(!popupIsError)"
        >
          Continue
        </button>
      </div>
    </div>

    <div class="admit-card__footer">
      <span>ACCOUNT RECOVERY</span>
      <span>SECURE SESSION</span>
    </div>
  </div>
</div>
