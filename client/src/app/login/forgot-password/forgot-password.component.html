<div class="card-scene grain-bg" [style.--role-color]="roleColor">
  <a routerLink="/login/{{ role }}login" class="back-link">
    &larr; back to faculty login
  </a>

  <div class="admit-card">
    <div class="admit-card__stripe"></div>

    <div class="admit-card__header">
      <div>
        <span class="admit-card__eyebrow">
          ABC Institute &middot; Account Recovery
        </span>

        <div class="admit-card__role">Forgot Password</div>
      </div>

      <div class="admit-card__seal">F</div>
    </div>

    <form
      (ngSubmit)="submit()"
      #forgotPassword="ngForm"
      class="admit-card__body"
    >
      <!-- Email -->
      <div class="field-group">
        <label class="field-label">Email</label>

        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          class="field-input"
          placeholder="Enter your email"
          required
        />
      </div>

      <!-- Submit -->
      <button
        type="submit"
        [disabled]="!forgotPassword.form.valid || loading"
        class="admit-submit"
      >
        Send Reset Link
      </button>

      <!-- Optional status -->
      <div *ngIf="loading" class="admit-status">
        <span class="dot"></span>
        Sending reset link
      </div>
    </form>

    <div class="success-overlay" *ngIf="showSuccessPopup">
      <div class="success-popup" [class.error-popup]="popupIsError">
        <div class="success-icon">
          {{ popupIsError ? "!" : "✓" }}
        </div>

        <h2>
          {{ popupIsError ? "Unable to Send Reset Link" : "Reset Link Sent" }}
        </h2>

        <p>
          {{ popupMessage }}
        </p>

        <button
          type="button"
          class="popup-button"
          (click)="closeSuccessPopup(!popupIsError)"
        >
          Continue
        </button>
      </div>
    </div>
    
    <div class="admit-card__footer">
      <span>ACCOUNT RECOVERY</span>
      <span>SECURE SESSION</span>
    </div>
  </div>
</div>
