<div class="admin-eyebrow">
  <i class="bi bi-journal-x"></i>
  <span>Delete Department</span>
</div>

<form class="ledger-panel ledger-form narrow-form" (ngSubmit)="submit()" #f="ngForm">
  <div class="ledger-field">
    <label>Department</label>
    <select required [(ngModel)]="department" name="department">
      <option value="">None</option>
      <option *ngFor="let dp of departments" [value]="dp.department">{{ dp.department }}</option>
    </select>
  </div>

  <div class="ledger-actions">
    <button type="submit" class="btn-ledger-primary" [disabled]="!f.form.valid || loading">Delete</button>
  </div>

  <div *ngIf="loading" class="ledger-status"><span class="dot"></span> Deleting</div>
  <p *ngIf="error" class="ledger-error">{{ error }}</p>
</form>
